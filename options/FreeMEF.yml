# general settings
name: train_FreeMEF_on_Kalantari
model_type: HDR_Model
scale: 1
num_gpu: auto  # auto: can infer from your visible devices automatically. official: 8 GPUs
manual_seed: 0
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: Kalantari_Dataset
    dataroot_hdr: datasets/Kalantari_MEF/Training_input
    dataroot_gt: datasets/Kalantari_MEF/Training_gt
    max_others: 4
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    mini_batch_sizes: [2,2,2,2,2,2]             # Batch size per gpu   
    iters: [92000,80000,38000,33000,33000,24000]
    gt_size: 256   # Max patch size for progressive training
    gt_sizes: [256,256,256,256,256,256]  # Patch sizes for progressive training.
    # data loader
    use_shuffle: true
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: ValSet
    type: Kalantari_Dataset
    dataroot_hdr: datasets/Kalantari_MEF/Testing_input
    dataroot_gt: datasets/Kalantari_MEF/Testing_gt
    io_backend:
      type: disk
      
# network structures
network_g:
  type: FreeMEF
  dim: 32
  num_blocks: [2, 2, 2, 2]
  num_refinement_blocks: 2


# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~ 

# training settings
train:
  ema_decay: 0.999

  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]       
    restart_weights: [1,1]
    eta_mins: [0.000285,0.000001]  

  total_iter: 300000
  warmup_iter: -1  # no warm up

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# Uncomment these for validation
# validation settings
val:
  val_freq: !!float 5e6
  save_img: False

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500